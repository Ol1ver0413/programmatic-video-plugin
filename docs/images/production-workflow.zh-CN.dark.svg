<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="594" viewBox="0 0 1120 594" role="img" aria-labelledby="title description">
  <title id="title">从创作到可复用能力</title>
  <desc id="description">project.json 关联时间轴、素材、场景与字幕。脑暴、脚本与计划之后，主 agent 使用 CLI/API 制作动态小样和全片，reviewer 给出反馈，用户确认后交付。制作 trace 和反馈经过单独分析、测试，沉淀为插件供下一次任务使用。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#768390" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { fill: #e6edf3; font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .brand { font-family: Georgia, "Noto Serif CJK SC", SimSun, serif; font-size: 27px; }
    .sub { fill: #9da7b3; font-size: 13px; }
    .label { font-size: 21px; font-weight: 600; }
    .detail { fill: #9da7b3; font-size: 12px; }
    .file { fill: #d2bcff; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 23px; font-weight: 600; }
    .edge-label { fill: #9da7b3; font-size: 12px; }
    .wire { fill: none; stroke: #768390; stroke-width: 1.6; marker-end: url(#arrow); stroke-linejoin: round; }
    .feedback { stroke: #9b89bd; }
  </style>
  <rect x="0.5" y="0.5" width="1119" height="593" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="65" class="brand" text-anchor="start">Programmatic Video</text>
  <text x="40" y="91" class="sub" text-anchor="start">让作品可编辑，让能力可复用。</text>
  <rect x="390" y="35" width="330" height="92" rx="11" fill="#241e36" stroke="#6d5a94" filter="url(#shadow)"/>
  <text x="555" y="73" class="file" text-anchor="middle">project.json</text>
  <text x="555" y="103" class="sub" text-anchor="middle">时间轴 · 素材 · 场景 · 字幕</text>
  <path d="M 555 127 V 215" class="wire"/>
  <text x="571" y="177" class="edge-label" text-anchor="start">关联执行工程</text>
  <rect x="40" y="216" width="160" height="102" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="238" y="216" width="186" height="102" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="686" y="216" width="180" height="102" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="966" y="216" width="120" height="102" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="462" y="216" width="186" height="102" rx="11" fill="#e6edf3" stroke="#e6edf3" filter="url(#shadow)"/>
  <text x="120" y="260" class="label" text-anchor="middle">脑暴</text>
  <text x="120" y="287" class="detail" text-anchor="middle">意图与参考素材</text>
  <text x="331" y="260" class="label" text-anchor="middle">脚本与计划</text>
  <text x="331" y="287" class="detail" text-anchor="middle">故事与时间分镜</text>
  <text x="555" y="248" class="label" text-anchor="middle" style="fill:#0d1117">制作</text>
  <text x="555" y="276" class="detail" text-anchor="middle" style="fill:#414b57">主 agent · CLI / API</text>
  <text x="555" y="300" class="detail" text-anchor="middle" style="fill:#414b57">动态小样 → 全片</text>
  <text x="776" y="260" class="label" text-anchor="middle">审片</text>
  <text x="776" y="287" class="detail" text-anchor="middle">按需使用一个 reviewer</text>
  <text x="1026" y="260" class="label" text-anchor="middle">视频</text>
  <text x="1026" y="287" class="detail" text-anchor="middle">成片与工程</text>
  <path d="M 200 267 H 237" class="wire"/>
  <path d="M 424 267 H 461" class="wire"/>
  <path d="M 648 267 H 685" class="wire"/>
  <path d="M 866 267 H 965" class="wire"/>
  <text x="916" y="251" class="edge-label" text-anchor="middle">用户确认</text>
  <path d="M 776 318 V 372 H 555 V 319" class="wire feedback"/>
  <text x="665" y="395" class="edge-label" text-anchor="middle">反馈 → 局部修改</text>
  <rect x="205" y="461" width="252" height="88" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="509" y="461" width="236" height="88" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <rect x="797" y="461" width="288" height="88" rx="11" fill="#161b22" stroke="#30363d" filter="url(#shadow)"/>
  <text x="331" y="498" class="label" text-anchor="middle">Plugin</text>
  <text x="331" y="525" class="detail" text-anchor="middle">Skills · CLI / API · Hooks</text>
  <text x="627" y="498" class="label" text-anchor="middle">分析与测试</text>
  <text x="627" y="525" class="detail" text-anchor="middle">提取可复用操作</text>
  <text x="941" y="498" class="label" text-anchor="middle">Trace 与反馈</text>
  <text x="941" y="525" class="detail" text-anchor="middle">实际制作过程与修改记录</text>
  <path d="M 797 505 H 746" class="wire feedback"/>
  <path d="M 509 505 H 458" class="wire feedback"/>
  <path d="M 331 461 V 319" class="wire feedback"/>
  <text x="347" y="399" class="edge-label" text-anchor="start">下一次任务</text>
  <path d="M 822 318 V 422 H 941 V 460" class="wire feedback"/>
  <text x="941" y="446" class="edge-label" text-anchor="middle">独立的开发迭代</text>
  <text x="40" y="578" class="detail" text-anchor="start">交付后记录本片经验与明确偏好；工具改动经测试和 PR 更新。</text>
</svg>
