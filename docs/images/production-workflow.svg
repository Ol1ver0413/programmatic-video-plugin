<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title description">
  <title id="title">The video production workflow</title>
  <desc id="description">Brainstorm, write the script and plan, confirm a moving draft, then produce, review and deliver. One project.json connects the project; review feedback guides revisions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#77756d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { fill: #2d2c28; font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .eyebrow { fill: #78766d; font-size: 12px; letter-spacing: 1.6px; }
    .heading { font-family: Georgia, "Noto Serif CJK SC", SimSun, serif; font-size: 36px; }
    .label { font-size: 21px; font-weight: 500; }
    .detail { fill: #6b6960; font-size: 13px; }
    .caption { fill: #6b6960; font-size: 15px; }
    .connector { fill: none; stroke: #77756d; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>
  <rect width="1120" height="440" fill="#faf9f5"/>
  <text x="64" y="43" class="eyebrow" text-anchor="start">PROGRAMMATIC VIDEO / WORKFLOW</text>
  <text x="64" y="91" class="heading" text-anchor="start">Make the video. Keep it editable.</text>
  <rect x="64" y="151" width="176" height="90" rx="8" fill="#fdfcf9" stroke="#b8b5a9"/>
  <text x="152.0" y="188" class="label" text-anchor="middle">Brainstorm</text>
  <text x="152.0" y="214" class="detail" text-anchor="middle">References + direction</text>
  <path d="M 240 196 H 266" class="connector"/>
  <rect x="268" y="151" width="176" height="90" rx="8" fill="#fdfcf9" stroke="#b8b5a9"/>
  <text x="356.0" y="188" class="label" text-anchor="middle">Script + plan</text>
  <text x="356.0" y="214" class="detail" text-anchor="middle">Story, then timed scenes</text>
  <path d="M 444 196 H 470" class="connector"/>
  <rect x="472" y="151" width="176" height="90" rx="8" fill="#f0dfd5" stroke="#c77b60"/>
  <text x="560.0" y="188" class="label" text-anchor="middle">Moving draft</text>
  <text x="560.0" y="214" class="detail" text-anchor="middle">Confirm before scaling up</text>
  <path d="M 648 196 H 674" class="connector"/>
  <rect x="676" y="151" width="176" height="90" rx="8" fill="#fdfcf9" stroke="#b8b5a9"/>
  <text x="764.0" y="188" class="label" text-anchor="middle">Make + review</text>
  <text x="764.0" y="214" class="detail" text-anchor="middle">Make, check, revise</text>
  <path d="M 852 196 H 878" class="connector"/>
  <rect x="880" y="151" width="176" height="90" rx="8" fill="#fdfcf9" stroke="#b8b5a9"/>
  <text x="968.0" y="188" class="label" text-anchor="middle">Deliver</text>
  <text x="968.0" y="214" class="detail" text-anchor="middle">Video + editable project</text>
  <path d="M 764 241 V 273 H 560 V 242" class="connector"/>
  <text x="662" y="300" class="caption" text-anchor="middle">Focused feedback, local revisions</text>
  <rect x="64" y="326" width="992" height="65" rx="8" fill="#f0eee6"/>
  <text x="88" y="366" font-size="21">project.json</text>
  <text x="280" y="365" class="caption" text-anchor="start">Timeline · asset references · scene code · captions</text>
  <text x="64" y="418" class="detail" text-anchor="start">Reuse image assets; compose frames in code. Add one independent reviewer when useful.</text>
</svg>
