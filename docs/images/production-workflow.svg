  <title id="title">Make videos. Build reusable capabilities.</title>
  <desc id="description">Brainstorm, script and plan, produce with project.json and reusable CLI/API tools, review, revise and deliver with user approval. A separate development loop turns traces and feedback into tested plugin improvements for the next task.</desc>
