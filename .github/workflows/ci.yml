name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Check unified version and release notes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            node scripts/version.mjs check --base "$BASE_REF"
          else
            npm run release:check
          fi
      - run: npm run format:check
      - run: npm run lint
      - name: Check Python helper syntax without writing caches
        run: python3 -c "import ast,pathlib; ast.parse(pathlib.Path('cli/lib/audio-audit.py').read_text(encoding='utf-8'))"

  test:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: ubuntu-latest
            node: '20'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PROGRAMMATIC_VIDEO_PYTHON: python
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/test-requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r .github/test-requirements.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - name: Require media dependencies so regressions cannot silently skip
        run: node -e "const {execFileSync}=require('node:child_process'); for(const tool of ['ffmpeg','ffprobe']) execFileSync(tool,['-version'],{stdio:'ignore'}); execFileSync('python',['-c','import numpy; print(numpy.__version__)'],{stdio:'inherit'}); console.log(process.platform,process.version)"
      - run: npm test
      - run: npm run test:package
      - name: Install Chromium for real rendering tests
        if: matrix.node == '22'
        run: npm exec -- playwright install --with-deps chromium
      - name: Test actual rendering, caches, captions and atlas preparation
        if: matrix.node == '22'
        run: npm run test:media

  verify:
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every code-quality and platform job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$QUALITY_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "Required checks failed or were skipped: quality=$QUALITY_RESULT, platforms=$TEST_RESULT"
            exit 1
          fi

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: public-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Publish the tested commit with its manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
