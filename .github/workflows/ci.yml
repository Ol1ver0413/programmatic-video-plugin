name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Install media test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Check unified version and release notes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != "0000000000000000000000000000000000000000" ]; then
            node scripts/version.mjs check --base "$BASE_REF"
          else
            npm run release:check
          fi
      - run: npm run format:check
      - run: npm test
      - name: Verify the complete distribution archive
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/plugin-check"
          tar -xzf "$RUNNER_TEMP"/programmatic-video-plugin-*.tgz -C "$RUNNER_TEMP/plugin-check"
          node tests/package-smoke.mjs "$RUNNER_TEMP/plugin-check/package"

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: public-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Publish the tested commit with its manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
