<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programmatic Video</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151e;color:#e4d8b9;font:14px Consolas,monospace}main{max-width:1120px;margin:36px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}small{color:#ab9470;letter-spacing:3px;font-size:10px}h1{font-size:27px;font-weight:500;margin:8px 0 0}canvas{display:block;width:100%;image-rendering:pixelated;background:#080e19}.controls{display:flex;gap:20px;align-items:center;margin:20px 0}button{background:#c85e5c;color:#fff1d4;border:0;font:inherit;padding:10px 22px;cursor:pointer}input{flex:1;min-width:40px;accent-color:#c85e5c}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #e2c080;outline-offset:3px}#time{font-size:12px;color:#aeae9d;min-width:96px}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #30404b;padding-top:16px;font-size:12px}a{color:#bca677;text-decoration:none}#status{color:#e98c80}body.render-mode{margin:0;background:#000}.render-mode main{margin:0;padding:0;max-width:none}.render-mode header,.render-mode .controls,.render-mode footer{display:none}@media(max-width:600px){main{margin-top:20px}.controls{gap:10px}button{padding:10px 14px}}
</style></head><body><script>if(new URLSearchParams(location.search).has('render'))document.body.classList.add('render-mode')</script><main>
<header><div><small>PROGRAMMATIC VIDEO</small><h1 id="title">载入中</h1></div></header>
<canvas id="film" aria-label="视频画面"></canvas>
<div class="controls"><button id="play" type="button">播放</button><input id="scrub" type="range" min="0" max="8" step="0.01" value="0" aria-label="视频进度"><span id="time"></span></div>
<footer><span id="status">正在准备画面</span><span><a href="output/video.mp4" download>MP4</a> / <a href="output/captions.srt" download>SRT 字幕</a></span></footer>
<audio preload="auto"></audio><script type="module" src="src/player.js"></script></main></body></html>
